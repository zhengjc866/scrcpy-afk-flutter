              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF_GRADLE

          mkdir -p android/app/src/main/assets
          curl -L https://github.com/Genymobile/scrcpy/releases/download/v2.4/scrcpy-server-v2.4 \
            -o android/app/src/main/assets/scrcpy-server

          flutter pub get
          flutter build apk --release

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-afk-release-apk
          path: scrcpy_afk_build/build/app/outputs/flutter-apk/app-release.apk

name: Build Scrcpy AFK APK (All-in-One)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Generate Full Flutter + Shizuku + Scrcpy Project & Build APK
        run: |
          mkdir -p scrcpy_afk_build
          cd scrcpy_afk_build
          flutter create . --project-name scrcpy_afk --org com.example --platforms android

